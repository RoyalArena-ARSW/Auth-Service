
spring.application.name=auth
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/auth_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:RoyalArena2026SuperLongSecretKeyForHmacSha512JwtValidation!!!!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.edu.eci.arsw.royalarena.auth=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN